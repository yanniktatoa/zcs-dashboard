services:
  app:
    build: .
    container_name: catalog-app
    env_file: .env
    ports:
      - "${APP_PORT}:8081"
    depends_on:
      - db
      - redis
      - kafka
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - catalog-net

  # Moteur SQL (requis par Spring Data JPA) — non expose sur l'hote ; admin via phpmyadmin
  db:
    image: mysql:8.0
    container_name: catalog-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - catalog-net

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: catalog-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      - db
    networks:
      - catalog-net

  redis:
    image: redis:7.4
    container_name: catalog-redis
    ports:
      - "6380:6379"
    networks:
      - catalog-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: catalog-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2182:2181"
    networks:
      - catalog-net

  # Broker unique partage : interne (catalog-app + consumers) + externe (loan-service via host)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: catalog-kafka
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: catalog-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://catalog-kafka:29092,PLAINTEXT_HOST://host.docker.internal:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - catalog-net

networks:
  catalog-net:
    driver: bridge
