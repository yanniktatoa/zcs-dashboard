services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-gateway
    ports:
      - "8080:8080"
    environment:
      # Les services backend tournent sur l'hôte (leurs propres stacks Docker)
      # host.docker.internal permet d'atteindre les ports exposés sur la machine hôte
      CATALOG_SERVICE_URL: http://host.docker.internal:8081
      USER_SERVICE_URL: http://host.docker.internal:8082
      LOAN_SERVICE_URL: http://host.docker.internal:8083
      ZIPKIN_URL: http://host.docker.internal:9411
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux uniquement (Docker Desktop le résout nativement)
    restart: unless-stopped
