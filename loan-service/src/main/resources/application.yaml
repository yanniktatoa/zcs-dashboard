server:
  port: 8083
spring:
  application:
    name: loan-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
          userService:
            connectTimeout: 3000
            readTimeout: 5000
          catalogService:
            connectTimeout: 3000
            readTimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/loan_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    # Par defaut : meme port que le broker catalog expose sur l'hote (docker compose catalog : 9093)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
clients:
  user:
    url: http://user-service:8082
  catalog:
    url: http://catalog-service:8081
resilience4j:
  circuitbreaker:
    instances:
      userService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        registerHealthIndicator: true
      catalogService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        registerHealthIndicator: true
    metrics:
      enabled: true
  timelimiter:
    instances:
      userService:
        timeoutDuration: 5s
      catalogService:
        timeoutDuration: 5s
    metrics:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
info:
  app:
    name: ${spring.application.name}
    description: Loan microservice - gestion des emprunts et outbox Kafka

---
spring:
  config:
    activate:
      on-profile: kubernetes
clients:
  user:
    url: http://user-service:8082
  catalog:
    url: http://catalog-service:8081
