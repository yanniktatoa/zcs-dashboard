spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

clients:
  user:
    url: http://localhost:8082
  catalog:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: loan-service-test
  prometheus:
    metrics:
      export:
        enabled: true

