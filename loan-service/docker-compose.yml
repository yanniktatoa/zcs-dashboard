services:
  app:
    build: .
    container_name: loan-app
    env_file: .env
    ports: ["${APP_PORT}:8083"]
    depends_on: [db]
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL}
    networks: [loan-net]
    # Acces au Kafka du catalog sur l'hote (port 9093) ; Linux : host-gateway
    extra_hosts:
      - "host.docker.internal:host-gateway"

  db:
    image: mysql:8.0
    container_name: loan-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks: [loan-net]

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: loan-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PMA_PORT}:80"
    depends_on: [db]
    networks: [loan-net]

networks:
  loan-net:
    driver: bridge
